name: Flight test report — Flight A
description: Fly the Flight A test missions and mark each test point Passed or Not passed
title: "Flight test A — "
labels: ["test report"]
body:
  - type: markdown
    attributes:
      value: |
        ## Flight test A

        Thank you for flying this. The full test plan, with the missions described, is on
        **[Flight Test A](https://mav87th.github.io/Edward-Documentation_and_Feedback/Flight_Test_A.html)**;
        keep it open while you fly. Each test point below says the same: what the feature is, what
        to do and what counts as a pass. Set each one to **Passed**, **Not passed** or leave it at
        **Not tested**, and write what you saw in the notes box after each part. Not passed is as
        useful as Passed, and a partly filled report is still welcome.

        > [!IMPORTANT]
        > **First, in the flying mission (Part 1): set the Directional Gyro.** The Mosquito's Directional Gyro (the
        > dial marked "DIRECTION INDICATOR" on the main panel) is not connected to the compass, so
        > after you enter the aircraft it can show any heading. Edward's headings are magnetic, so
        > straight after entering the cockpit read the **magnetic compass** (straight and level) and
        > turn the **Directional Gyro Adjustment Control Knob**, just below the dial, until the gyro
        > shows the same heading. Check it again about every 15 minutes; the gyro slowly drifts.

        **What Edward is.** Edward is the navigator in the right-hand seat of the DCS Mosquito
        FB Mk VI. He calls out headings and times, keeps the fuel cocks right, arms the bombs and
        works the bomb bay on a bomb run, and can hold the aircraft on a course and altitude for
        you. You talk to him through a ring menu: press **e** in flight. Every menu wedge is
        explained in [The Edward Menu — Notes](https://mav87th.github.io/Edward-Documentation_and_Feedback/Edward_Menu_Overview.html).

        **Words used below**
        - **Hold** (menu: *Hold My Aircraft*) — Edward holds the aircraft on a set course and
          altitude. You fly the aircraft yourself in this test; use Hold only where a test point
          asks for it.
        - **Steer call** — Edward's on-screen line telling you the course to fly, e.g.
          "Two minutes to WP2. Steer 095°M, range 8.1 NM."
        - **dcs.log** — `Saved Games\<your DCS folder>\Logs\dcs.log`. Some points ask you to search
          it for a line of text after the flight (open it in a text editor and use Find).

        **Missions** (supplied with the test build): `Edward-FlightA-High.miz` (Part 1) and
        `Edward-DRSurvey-Normandy.miz` (Part 2).

        **Before you start**
        1. Install the test build (Install.bat) and **restart DCS**.
        2. In flight, menu **Status ▸ Logging**: set to ON (the log lines below need it).
        3. Menu **Settings ▸ Automations**: everything ON.
        4. In the cockpit of the flying mission (Part 1): set the Directional Gyro to the magnetic compass (see above).

  - type: input
    id: build
    attributes:
      label: Edward test build
      description: The name or date of the zip you installed.
      placeholder: Edward_Mod_Files, 2026-10-17
    validations:
      required: false

  - type: input
    id: dcs-version
    attributes:
      label: DCS version
      placeholder: 2.9.30.xxxxx
    validations:
      required: false

  - type: dropdown
    id: display
    attributes:
      label: Flown in
      options:
        - 2D (monitor)
        - VR
    validations:
      required: false

  # ---------------------------------------------------------------------------------------------
  - type: markdown
    attributes:
      value: |
        ---
        ## Part 1 — Mission FlightA-High: the turn calls

        You start heading **183° magnetic**, so first set the Directional Gyro to 183.
        Fly the route to WP3; the bomb run after it is not part of this test.

  - type: dropdown
    id: p1-1
    attributes:
      label: 1.1 — "Turn now" comes before the waypoint
      description: |
        **What:** Edward calls each turn before the waypoint, worked out for a 30° bank turn (the
        first mark on the bank indicator) at your present speed, so you roll out on the line to the
        next waypoint instead of overshooting it.
        **Do:** watch the range to WP1 on the Navigation page as the turn call comes. Do the same at
        WP2 and WP3.
        **Pass:** "Turn starboard now for heading … New track …" (or port) comes before each
        waypoint: about half a mile out for a gentle turn, a little over a mile for a right-angle
        turn, more for a sharper one. dcs.log has one line `turn point for WP1`, and the same for WP2
        and WP3. In the notes, write the range shown when each call came.
      options: [Not tested, Passed, Not passed]
      default: 0

  - type: textarea
    id: notes-1
    attributes:
      label: Notes on Part 1
      description: The range at each turn call, and anything that looked odd.
    validations:
      required: false

  # ---------------------------------------------------------------------------------------------
  - type: markdown
    attributes:
      value: |
        ---
        ## Part 2 — Mission DRSurvey: saving landmark points

        You start on the ground and the heading doesn't matter here, so there is no need to set the
        Directional Gyro. A mission with exactly one aircraft lets you edit the landmark points
        Edward uses for a map.
        This test saves the Normandy file, so **back it up first**: copy
        `Saved Games\<your DCS folder>\Scripts\Edward\DRPoints\Normandy.lua` somewhere safe.

  - type: dropdown
    id: p2-1
    attributes:
      label: 2.1 — Saving shows a result on the menu
      description: |
        **Do:** open *Navigation ▸ DR Landmarks*. Delete one point (or use *Re-survey Theatre*), then
        *Save*.
        **Pass:** the centre of the page shows `SAVED n + n YOURS` (two numbers).
      options: [Not tested, Passed, Not passed]
      default: 0

  - type: dropdown
    id: p2-2
    attributes:
      label: 2.2 — Backup put back
      description: Copy your backed-up `Normandy.lua` back into `DRPoints`, so normal missions use the original points again.
      options: [Not tested, Done, Not done]
      default: 0

  - type: textarea
    id: notes-2
    attributes:
      label: Notes on Part 2
    validations:
      required: false

  # ---------------------------------------------------------------------------------------------
  - type: textarea
    id: log
    attributes:
      label: dcs.log
      description: |
        Please attach `Saved Games\<your DCS folder>\Logs\dcs.log` from the flight: drag the file
        into this box. DCS starts a new log every time it starts, so attach it before starting DCS
        again.
    validations:
      required: false
