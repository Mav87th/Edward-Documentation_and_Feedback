name: Flight test report — Flight A
description: Fly the Flight A test missions and mark each test point Passed or Not passed
title: "Flight test A — "
labels: ["test report"]
body:
  - type: markdown
    attributes:
      value: |
        ## Flight test A

        Thank you for flying this. The full test plan, with the missions described, is on
        **[Flight Test A](https://mav87th.github.io/Edward-Documentation_and_Feedback/Flight_Test_A.html)**;
        keep it open while you fly. Each test point below says the same: what the feature is, what
        to do and what counts as a pass. Set each one to **Passed**, **Not passed** or leave it at
        **Not tested**, and write what you saw in the notes box after each part. Not passed is as
        useful as Passed, and a partly filled report is still welcome.

        > [!IMPORTANT]
        > **First, in the flying mission (Part 1): set the Directional Gyro.** The Mosquito's Directional Gyro (the
        > dial marked "DIRECTION INDICATOR" on the main panel) is not connected to the compass, so
        > after you enter the aircraft it can show any heading. Edward's headings are magnetic, so
        > straight after entering the cockpit read the **magnetic compass** (straight and level) and
        > turn the **Directional Gyro Adjustment Control Knob**, just below the dial, until the gyro
        > shows the same heading. Check it again about every 15 minutes; the gyro slowly drifts.

        **What Edward is.** Edward is the navigator in the right-hand seat of the DCS Mosquito
        FB Mk VI. He calls out headings and times, keeps the fuel cocks right, arms the bombs and
        works the bomb bay on a bomb run, and can hold the aircraft on a course and altitude for
        you. You talk to him through a ring menu: press **e** in flight. Every menu wedge is
        explained in [The Edward Menu — Notes](https://mav87th.github.io/Edward-Documentation_and_Feedback/Edward_Menu_Overview.html).

        **Words used below**
        - **Hold** (menu: *Hold My Aircraft*) — Edward holds the aircraft on a set course and
          altitude. You fly the aircraft yourself in this test; use Hold only where a test point
          asks for it. In the pilot seat, moving the stick turns Hold off ("Hold off - you have
          her."); keep your hand off the stick while Hold is on.
        - **Steer call** — Edward's on-screen line telling you the course to fly, e.g.
          "Two minutes to WP2. Steer 095°M, range 8.1 NM."
        - **dcs.log** — `Saved Games\<your DCS folder>\Logs\dcs.log`. Some points ask you to search
          it for a line of text after the flight (open it in a text editor and use Find).

        **Missions** (supplied with the test build): `Edward-FlightA-High.miz` (Parts 1 and 2) and
        `Edward-FlightA-Landmarks.miz` (Part 3).

        **Before you start**
        1. Install the test build (Install.bat) and **restart DCS**.
        2. In flight, menu **Status ▸ Logging**: set to ON (the log lines below need it).
        3. Menu **Settings ▸ Automations**: everything ON.
        4. In the cockpit of both missions: set the Directional Gyro to the magnetic compass (see above).

  - type: input
    id: build
    attributes:
      label: Edward test build
      description: The name or date of the zip you installed.
      placeholder: Edward_Mod_Files, 2026-10-19
    validations:
      required: false

  - type: input
    id: dcs-version
    attributes:
      label: DCS version
      placeholder: 2.9.30.xxxxx
    validations:
      required: false

  - type: dropdown
    id: display
    attributes:
      label: Flown in
      options:
        - 2D (monitor)
        - VR
    validations:
      required: false

  # ---------------------------------------------------------------------------------------------
  - type: markdown
    attributes:
      value: |
        ---
        ## Part 1 — Mission FlightA-High: the turn calls

        You start heading **183° magnetic**, so first set the Directional Gyro to 183.
        Fly the route to WP3; the bomb run after it is not part of this test.

  - type: dropdown
    id: p1-1
    attributes:
      label: 1.1 — "Turn now" comes before the waypoint
      description: |
        **What:** Edward calls each turn before the waypoint, worked out for a 30° bank turn (the
        first mark on the bank indicator) at your present speed, so you roll out on the line to the
        next waypoint instead of overshooting it.
        **Do:** watch the range to WP1 on the Navigation page as the turn call comes. Do the same at
        WP2 and WP3.
        **Pass:** "Turn starboard now for heading … New track …" (or port) comes before each
        waypoint: about half a mile out for a gentle turn, a little over a mile for a right-angle
        turn, more for a sharper one. dcs.log has one line `turn point for WP1`, and the same for WP2
        and WP3. In the notes, write the range shown when each call came.
      options: [Not tested, Passed, Not passed]
      default: 0

  - type: textarea
    id: notes-1
    attributes:
      label: Notes on Part 1
      description: The range at each turn call, and anything that looked odd.
    validations:
      required: false

  # ---------------------------------------------------------------------------------------------
  - type: markdown
    attributes:
      value: |
        ---
        ## Part 2 — Mission FlightA-High: a landmark of your own

        Edward calls out landmarks (churches, bridges, lakes…) as you pass them. The landmarks for
        Normandy come with Edward. You can add your own, and keep them for every later flight on the
        map. Do this in the same flight as Part 1, or in a second one.

  - type: dropdown
    id: p2-1
    attributes:
      label: 2.1 — Save My Landmarks keeps an FP mark
      description: |
        **Do:** on the F10 map, place a mark on something you can see near the route and give it
        the text `FP - My Landmark`. Open *Navigation ▸ DR Landmarks* and click
        *Save My Landmarks (1)*.
        **Pass:** the mark leaves the F10 map and the centre of the page shows `SAVED 1 OF YOURS`.
        dcs.log has the line `save my landmarks: 1 new`.
      options: [Not tested, Passed, Not passed]
      default: 0

  - type: textarea
    id: notes-2
    attributes:
      label: Notes on Part 2
    validations:
      required: false

  # ---------------------------------------------------------------------------------------------
  - type: markdown
    attributes:
      value: |
        ---
        ## Part 3 — Mission FlightA-Landmarks: landmarks saved with the mission

        Each time you load a mission in single player, Edward picks landmarks
        along the route of every Mosquito flight in it and saves them into a copy of the mission,
        named `<mission>_navpoints.miz`, in the same folder. In that copy the landmarks are ordinary
        navigation points, which is how they reach every player in multiplayer. Set the Directional
        Gyro first.

  - type: dropdown
    id: p3-1
    attributes:
      label: 3.1 — Landmarks saved with the mission
      description: |
        **Do:** load `Edward-FlightA-Landmarks.miz` and take the slot.
        **Pass:** once you are in the cockpit (not hidden behind the loading screen): "EDMod: DR
        landmarks for 2 flights saved to Edward-FlightA-Landmarks_navpoints.miz - host that file in
        multiplayer." That file is now in the same folder as the mission. Leave the mission.
      options: [Not tested, Passed, Not passed]
      default: 0

  - type: dropdown
    id: p3-2
    attributes:
      label: 3.2 — Landmarks show as nav points
      description: |
        **Do:** load `Edward-FlightA-Landmarks_navpoints.miz` and take the slot. Look at the F10
        map, then open *Navigation ▸ DR Landmarks*.
        **Pass:** the landmarks show on the map with plain names, along your route and along the
        other flight's route, with no second Edward mark on top of them. The DR Landmarks page shows
        *Landmarks on Your Route (n)*.
      options: [Not tested, Passed, Not passed]
      default: 0

  - type: dropdown
    id: p3-3
    attributes:
      label: 3.3 — Landmark calls along the route
      description: |
        **Do:** fly the route in this `_navpoints` mission.
        **Pass:** about a minute before each landmark on your route, a heads-up call ("Pinpoint in
        one minute - …"), then a fix call as it passes ("There is …", with how early or late you are
        and which side of the track). A landmark at most turning points, and more along longer legs, roughly every 3-6 minutes. In the
        notes: could you see each one, and did early/late and the side of track match what you saw?
      options: [Not tested, Passed, Not passed]
      default: 0

  - type: dropdown
    id: p3-4
    attributes:
      label: 3.4 — A landmark of your own
      description: |
        **Do:** on the F10 map, place a mark a few minutes ahead, no more than 2 NM from your route
        line, with the text `FP - Test`. Don't touch the menu.
        **Pass:** about a minute before you reach it, a heads-up call for "Test", then a fix call as
        you pass, each once. Edward draws no mark of his own over yours.
      options: [Not tested, Passed, Not passed]
      default: 0

  - type: textarea
    id: notes-3
    attributes:
      label: Notes on Part 3
      description: Whether you could see each landmark, and anything that looked odd.
    validations:
      required: false

  # ---------------------------------------------------------------------------------------------
  - type: textarea
    id: log
    attributes:
      label: dcs.log
      description: |
        Please attach `Saved Games\<your DCS folder>\Logs\dcs.log` from the flight: drag the file
        into this box. DCS starts a new log every time it starts, so attach it before starting DCS
        again.
    validations:
      required: false
